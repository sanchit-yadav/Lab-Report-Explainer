apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cds-ingress
  namespace: clinical-cds
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.labexplainer.health
        - app.labexplainer.health
      secretName: cds-tls-certificates
  rules:
    - host: api.labexplainer.health
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cds-api-service
                port:
                  number: 8000
    - host: app.labexplainer.health
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cds-web-service
                port:
                  number: 8501
