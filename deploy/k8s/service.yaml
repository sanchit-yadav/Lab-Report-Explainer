apiVersion: v1
kind: Service
metadata:
  name: cds-api-service
  namespace: clinical-cds
  labels:
    app.kubernetes.io/name: cds-api
    app.kubernetes.io/part-of: lab-report-explainer
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/name: cds-api
---
apiVersion: v1
kind: Service
metadata:
  name: cds-web-service
  namespace: clinical-cds
  labels:
    app.kubernetes.io/name: cds-web
    app.kubernetes.io/part-of: lab-report-explainer
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8501
      targetPort: 8501
      protocol: TCP
  selector:
    app.kubernetes.io/name: cds-web
