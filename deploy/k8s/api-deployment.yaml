apiVersion: apps/v1
kind: Deployment
metadata:
  name: cds-api-deployment
  namespace: clinical-cds
  labels:
    app.kubernetes.io/name: cds-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: lab-report-explainer
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cds-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cds-api
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/sanchit-yadav/lab-report-explainer:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cds-config
            - secretRef:
                name: cds-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: staging-uploads
              mountPath: /app/data/uploads
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: staging-uploads
          emptyDir:
            sizeLimit: 10Gi
        - name: tmp-volume
          emptyDir:
            sizeLimit: 2Gi
