apiVersion: apps/v1
kind: Deployment
metadata:
  name: cds-worker-deployment
  namespace: clinical-cds
  labels:
    app.kubernetes.io/name: cds-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: lab-report-explainer
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cds-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cds-worker
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 120 # Allow in-flight OCR & extraction to finish safely
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/sanchit-yadav/lab-report-explainer:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "src.workers.tasks", "worker", "--loglevel=info", "--concurrency=4"]
          envFrom:
            - configMapRef:
                name: cds-config
            - secretRef:
                name: cds-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 3000m
              memory: 6Gi
          volumeMounts:
            - name: staging-uploads
              mountPath: /app/data/uploads
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: staging-uploads
          emptyDir:
            sizeLimit: 10Gi
        - name: tmp-volume
          emptyDir:
            sizeLimit: 2Gi
