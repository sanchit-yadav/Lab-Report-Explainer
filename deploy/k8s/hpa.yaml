apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cds-api-hpa
  namespace: clinical-cds
  labels:
    app.kubernetes.io/name: cds-api
    app.kubernetes.io/part-of: lab-report-explainer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cds-api-deployment
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
      selectPolicy: Min
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cds-worker-hpa
  namespace: clinical-cds
  labels:
    app.kubernetes.io/name: cds-worker
    app.kubernetes.io/part-of: lab-report-explainer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cds-worker-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
