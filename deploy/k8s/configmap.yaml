apiVersion: v1
kind: ConfigMap
metadata:
  name: cds-config
  namespace: clinical-cds
  labels:
    app.kubernetes.io/name: lab-report-explainer
    app.kubernetes.io/part-of: lab-report-explainer
data:
  ENVIRONMENT: "production"
  RELEASE_VERSION: "1.0.0"
  LOG_LEVEL: "INFO"
  MAX_UPLOAD_SIZE_MB: "50"
  RAG_TOP_K: "5"
  RAG_RERANK_TOP_N: "3"
  DEMOGRAPHIC_STRATIFICATION_ENABLED: "true"
  LOINC_ONTOLOGY_ENABLED: "true"
  REDIS_URL: "redis://:$(REDIS_PASSWORD)@redis-service.clinical-cds.svc.cluster.local:6379/0"
  DATABASE_URL: "postgresql://cds_user:$(POSTGRES_PASSWORD)@postgres-service.clinical-cds.svc.cluster.local:5432/cds_db"
