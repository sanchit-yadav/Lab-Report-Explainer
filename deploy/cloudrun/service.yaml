apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: lab-report-explainer-api
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/execution-environment: gen2
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/vpc-access-connector: "projects/cds-prod/locations/us-central1/connectors/cds-vpc"
        run.googleapis.com/cloudsql-instances: "cds-prod:us-central1:cds-pgvector"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: cds-service-account@cds-prod.iam.gserviceaccount.com
      containers:
        - image: gcr.io/cds-prod/lab-report-explainer:latest
          command:
            - uvicorn
            - src.api.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - --workers
            - "2"
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2000m"
              memory: "4Gi"
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: RELEASE_VERSION
              value: "1.0.0"
            - name: DEMOGRAPHIC_STRATIFICATION_ENABLED
              value: "true"
            - name: LOINC_ONTOLOGY_ENABLED
              value: "true"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-key
                  key: latest
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: sentry-dsn
                  key: latest
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-url
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-url
                  key: latest
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
