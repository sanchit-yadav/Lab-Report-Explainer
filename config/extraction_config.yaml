# Extraction pipeline configuration
# Controls 3-tier fallback, header patterns, and deterministic flagging rules

tiers:
  - name: "pdfplumber"
    enabled: true
    priority: 1
  - name: "camelot"
    enabled: true
    priority: 2
    method: "lattice"
  - name: "vision"
    enabled: true
    priority: 3
    model: "gemini-3.5-flash"

header_patterns:
  test_name:
    - "test name"
    - "investigation"
    - "test"
    - "parameter"
    - "analyte"
    - "description"
    - "analyte name"
    - "test/investigation"
    - "findings"
    - "s.no"
    - "serial"
  value:
    - "value"
    - "result"
    - "observed value"
    - "obs. value"
    - "obs value"
    - "your result"
    - "patient value"
    - "result value"
    - "your value"
    - "measured"
    - "findings"
  unit:
    - "unit"
    - "units"
    - "uom"
    - "unit of measurement"
  ref_range:
    - "reference"
    - "ref range"
    - "normal range"
    - "biological ref"
    - "ref. interval"
    - "reference range"
    - "bio. ref. interval"
    - "ref. range"
    - "range"
    - "interval"
    - "ref interval"
    - "reference interval"
    - "bio. ref. interval"

flagging:
  critical_multiplier: 2.0
  non_numeric_map:
    "positive": "abnormal"
    "reactive": "abnormal"
    "non-reactive": "normal"
    "negative": "normal"
    "detected": "abnormal"
    "not detected": "normal"

report_types:
  blood_test:
    extractor: "tabular"
    flagger: "range_comparison"
    rag_collection: "lab_tests"
