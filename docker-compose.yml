services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab_report_explainer_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
      - DATABASE_URL=postgresql://lab_user:lab_secure_password@postgres:5432/lab_explainer_db
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lab_network
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M

  postgres:
    image: pgvector/pgvector:pg16
    container_name: lab_report_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: lab_user
      POSTGRES_PASSWORD: lab_secure_password
      POSTGRES_DB: lab_explainer_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_user -d lab_explainer_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lab_network

  redis:
    image: redis:7-alpine
    container_name: lab_report_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lab_network

networks:
  lab_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
