[project]
name = "lab-report-explainer"
version = "0.1.0"
description = "AI Lab Report Explainer — Extraction + RAG with deterministic flagging & guardrails"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.67.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.4",
    "pdfplumber==0.11.10",
    "pypdfium2==5.15.2",
    "opencv-python-headless==5.0.0.93",
    "camelot-py==2.0.0",
    "google-genai==3.1.0",
    "chromadb==1.5.9",
    "sentence-transformers==6.2.0",
    "langfuse==5.2.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "rich==15.0.0",
    "reportlab==5.1.0",
    "gtts==2.5.4",
    "fastapi==0.162.7",
    "uvicorn==0.54.0",
    "python-multipart==0.0.33",
    "sqlalchemy==2.1.8",
    "pyjwt==2.15.1",
    "bcrypt==5.0.0",
    "httpx==0.28.1",
    "psycopg2-binary==2.9.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, unused vars)
    "I",   # isort (import sorting)
]
ignore = [
    "E501", # line-too-long (handled by ruff format)
    "E402", # module import not at top of file (sys.path configuration)
    "W291", # trailing whitespace in multi-line templates
    "W293", # blank line whitespace
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
