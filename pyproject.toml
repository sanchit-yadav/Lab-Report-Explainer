[project]
name = "lab-report-explainer"
version = "0.1.0"
description = "AI Lab Report Explainer — Extraction + RAG with deterministic flagging & guardrails"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.30.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "pdfplumber>=0.10.0",
    "camelot-py>=2.0.0",
    "google-genai>=1.51.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.0.0",
    "langfuse>=2.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "rich>=13.0.0",
    "reportlab>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
